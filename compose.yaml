x-app: &app
  build: ./apps/api
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

x-db-tool: &db-tool
  <<: *app
  profiles: [tools]
  environment:
    PGHOST: db
    PGDATABASE: sentinel
    PGUSER: postgres
    PGPASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/init_env.py}
  depends_on:
    db: {condition: service_healthy}

services:
  access-init:
    <<: *app
    environment:
      PGHOST: db
      PGDATABASE: sentinel
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py}
      SENTINEL_APP_PASSWORD: ${SENTINEL_APP_PASSWORD:?Run scripts/init_env.py}
      SENTINEL_WORKER_PASSWORD: ${SENTINEL_WORKER_PASSWORD:?Run scripts/init_env.py}
    depends_on:
      db: {condition: service_healthy}
    command: ["python", "-m", "api_sentinel.identity.operator", "prepare"]
  migrate:
    <<: *db-tool
    command: ["alembic", "upgrade", "head"]
  record-tests:
    <<: *db-tool
    build:
      context: ./apps/api
      target: record-tests
  db:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/init_env.py}
      SENTINEL_PROBE_PASSWORD: ${SENTINEL_PROBE_PASSWORD:?Generate .env with scripts/init_env.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/10-probe.sql:/docker-entrypoint-initdb.d/10-probe.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "sentinel"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    <<: *app
    environment:
      PGHOST: db
      PGDATABASE: sentinel
      SENTINEL_APP_PASSWORD: ${SENTINEL_APP_PASSWORD:?Run scripts/init_env.py}
      SENTINEL_WEB_ORIGIN: ${SENTINEL_WEB_ORIGIN:-http://127.0.0.1:${WEB_PORT:-8080}}
      SENTINEL_EVENT_HMAC_KEY: ${SENTINEL_EVENT_HMAC_KEY:?Run scripts/init_env.py}
      PGUSER: sentinel_app
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      access-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    environment:
      PGHOST: db
      PGDATABASE: sentinel
      SENTINEL_AUTHENTICATION_FAILURES_THRESHOLD: "${SENTINEL_AUTHENTICATION_FAILURES_THRESHOLD-8}"
      SENTINEL_AUTHORIZATION_DENIALS_THRESHOLD: "${SENTINEL_AUTHORIZATION_DENIALS_THRESHOLD-10}"
      SENTINEL_HIGH_REQUEST_VOLUME_THRESHOLD: "${SENTINEL_HIGH_REQUEST_VOLUME_THRESHOLD-61}"
      PGUSER: sentinel_worker
      PGPASSWORD: ${SENTINEL_WORKER_PASSWORD:?Run scripts/init_env.py}
    depends_on:
      access-init: {condition: service_completed_successfully}
    command: ["python", "-m", "api_sentinel.worker"]
  web:
    build: ./apps/web
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on:
      api: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
