version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-patches:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      web-patches:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
