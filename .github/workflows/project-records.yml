name: Project records

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project-records-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  records:
    name: PostgreSQL migrations and record tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Create local test credentials
        run: python3 scripts/init_env.py

      - name: Apply and verify migrations
        run: |
          docker compose run --rm --build migrate
          docker compose run --rm migrate alembic current --check-heads
          docker compose run --rm migrate alembic check

      - name: Run PostgreSQL integration tests
        run: docker compose run --rm --build record-tests

      - name: Check API types and unit tests
        run: |
          docker compose run --rm -v "$PWD:/checkout:ro" -w /checkout/apps/api \
            -e PYTHONPATH=/checkout/apps/api/src record-tests sh -ec '
              ruff check --no-cache src tests migrations integration ../../scripts
              mypy --cache-dir=/tmp/mypy
              pytest -q -p no:cacheprovider tests'

      - name: Verify incident workflows and tenant permissions in Chrome
        run: |
          docker compose up --build --wait
          python3 scripts/smoke.py
          npm ci --prefix apps/web --no-audit --no-fund
          node --test apps/web/tests/check-browser-requests.mjs
          CHROME_BIN="$(command -v google-chrome)" python3 scripts/smoke_access.py --browser --rules

      - name: Check Python formatting
        if: ${{ !cancelled() }}
        run: |
          docker compose run --rm -v "$PWD:/checkout:ro" -w /checkout/apps/api \
            -e PYTHONPATH=/checkout/apps/api/src record-tests \
            ruff format --config pyproject.toml --no-cache --diff src tests migrations integration ../../scripts
