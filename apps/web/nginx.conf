worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Nginx request error entries can include the raw URL.
        error_log /dev/null;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

        location /api/v1/ {
            client_max_body_size 128k;
            client_body_buffer_size 128k;
            resolver 127.0.0.11 ipv6=off valid=10s;
            set $backend http://api:8000;
            proxy_pass $backend;
            proxy_pass_request_headers off;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Encoding $http_content_encoding;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
        }

        location = /health/ready {
            resolver 127.0.0.11 ipv6=off valid=10s;
            set $api http://api:8000;
            proxy_pass $api/health/ready;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }

        location / { try_files $uri $uri/ =404; }
    }
}
