[project]
name = "api-sentinel"
version = "0.1.0.dev0"
requires-python = "==3.12.*"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1"]

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.17.5", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
