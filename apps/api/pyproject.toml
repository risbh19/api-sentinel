[project]
name = "api-sentinel"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx2==2.16.2", "mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 99

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
